<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <style>
        /* --- CUSTOM GLASS SCROLLBAR --- */
        /* For Chrome, Safari, and Edge */
        ::-webkit-scrollbar {
            width: 10px;
            background: transparent; /* Makes the scrollbar track invisible */
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15); /* Match the glass border tint */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 10px;
            border: 2px solid transparent; /* Gives it spacing from the window edge */
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3); /* Brightens up slightly when hovered */
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        /* For Firefox */
        * {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }

        /* --- REST OF THE CODE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* The Frosted Glass Container */
        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 2rem;
        }

        /* Glass Input Field */
        input {
            flex: 1;
            padding: 0.85rem 1.2rem;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Glass Glow Button */
        button {
            padding: 0.85rem 1.8rem;
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        button:hover {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        /* Video Box Styling */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; 
            height: 0;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Glass Placeholder */
        .placeholder-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            padding: 4rem 1rem;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            font-size: 1.05rem;
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Class Viewer</h1>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste YouTube video link here...">
            <button id="watchBtn">Watch</button>
        </div>

        <div id="placeholder" class="placeholder-text">
            Enter a valid YouTube link above to start watching.
        </div>

        <div id="videoWrapper" class="video-container">
            <iframe id="videoPlayer" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
