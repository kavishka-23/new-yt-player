<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Center application card and remove default window scrollbars */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #1a103c 0%, #0b0f19 60%, #250945 100%);
            overflow: hidden;
            padding: 20px;
        }

        /* Responsive 16:9 Grid Layout Container */
        .container {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 16px;
            height: 88vh;
            aspect-ratio: 16 / 9;
            max-width: 95vw;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Top Bar Layout containing Branding and Search Control */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .branding h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Input Control Container bar */
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 4px 6px 4px 16px;
            width: 480px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-box:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        .search-box button {
            background: #a855f7;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search-box button:hover {
            background: #9333ea;
            transform: translateY(-1px);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        /* Player Wrapper displaying 16:9 aspect screen cards */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
        }

        /* Initial Placeholder View Card display state layout setup */
        .placeholder-view {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #64748b;
            z-index: 2;
            transition: opacity 0.4s ease;
        }

        .placeholder-view svg {
            width: 48px;
            height: 48px;
            fill: rgba(255, 255, 255, 0.15);
            margin-bottom: 4px;
        }

        .placeholder-view p {
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        #videoPlayer {
            position: absolute;
            width: 100%;
