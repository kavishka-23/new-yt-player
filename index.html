<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #311042 100%);
            /* Using dynamic viewport height to lock things vertically */
            height: 100vh;
            height: 100dvh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden; /* Prevents outer page scrolling entirely */
        }

        /* The Frosted Glass Container */
        .container {
            width: 100%;
            max-width: 900px;
            /* Prevents container from ever growing taller than the screen */
            max-height: 95vh; 
            
            background: rgba(255, 255, 255, 0.08); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            
            padding: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            
            /* Turns container into a flex column to handle its children sizes dynamically */
            display: flex;
            flex-direction: column;
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            color: #ffffff;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            flex-shrink: 0; /* Prevents heading from shrinking */
        }

        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 1rem;
            flex-shrink: 0; /* Prevents inputs from squeezing */
        }

        /* Glass Input Field */
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* Glass Glow Button */
        button {
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.9);
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        button:hover {
            background: #ffffff;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
        }

        /* Video Box Aspect-Ratio Scaling */
        .video-container {
            width: 100%;
            /* Modern approach replaces bottom padding trick */
            aspect-ratio: 16 / 9; 
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: none; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            
            /* Tells browser to scale down automatically based on parent height limit */
            max-height: calc(95vh - 120px); 
            margin: 0 auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Glass Placeholder */
        .placeholder-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            padding: 4rem 1rem;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            font-size: 1.05rem;
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Class Viewer</h1>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste YouTube video link here...">
            <button id="watchBtn">Watch</button>
        </div>

        <div id="placeholder" class="placeholder-text">
            Enter a valid YouTube link above to start watching.
        </div>

        <div id="videoWrapper" class="video-container">
            <iframe id="videoPlayer" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
