<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Prevent scrollbars and center the application container */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #1a103c 0%, #0b0f19 60%, #250945 100%);
            overflow: hidden;
            padding: 20px;
        }

        /* 16:9 Grid Layout Container */
        .container {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 16px;
            height: 88vh;
            aspect-ratio: 16 / 9;
            max-width: 95vw;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.15);
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            background: linear-gradient(to right, #ffffff, #cbd5e1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-grow: 1;
            max-width: 450px;
        }

        input {
            flex-grow: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
        }

        button {
            background: linear-gradient(to right, #9333ea, #4f46e5);
            color: white;
            border: none;
            font-weight: 600;
            padding: 0 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Video Frame Box */
        .video-wrapper {
            width: 100%;
            height: 100%;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Target element for YouTube API placeholder */
        #videoPlayer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Mobile Layout */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .container {
                grid-template-rows: auto auto;
                height: auto;
                aspect-ratio: auto;
                width: 100%;
                padding: 16px;
            }
            .header-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .input-group {
                width: 100%;
            }
            .video-wrapper {
                aspect-ratio: 16 / 9;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-bar">
            <h1>Smart Class Viewer</h1>
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="Paste YouTube Video URL here...">
                <button onclick="loadVideo()">Watch</button>
            </div>
        </div>

        <div class="video-wrapper">
            <div id="videoPlayer"></div>
        </div>

    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let currentVideoId = 'QDS7Hp-fMqs'; // Default startup video ID
        let trackingInterval;

        // Automatically runs as soon as the YouTube API scripts finish loading
        function onYouTubeIframeAPIReady() {
            createPlayer(currentVideoId);
        }

        // Instantiates or updates the player connection dynamically
        function createPlayer(videoId, startSeconds = 0) {
            // Clean up old polling intervals if refreshing a video link
            clearInterval(trackingInterval);

            player = new YT.Player('videoPlayer', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'playsinline': 1,
                    'start': startSeconds
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            // Start checking timestamps once the video plays
            startTrackingProgress();
        }

        function onPlayerStateChange(event) {
            // Track when playing (1), stop tracking when paused or buffering
            if (event.data == YT.PlayerState.PLAYING) {
                startTrackingProgress();
            } else {
                clearInterval(trackingInterval);
            }
        }

        // Saves current timestamp location to storage every single second
        function startTrackingProgress() {
            clearInterval(trackingInterval);
            trackingInterval = setInterval(() => {
                if (player && typeof player.getCurrentTime === 'function') {
                    const currentTime = Math.floor(player.getCurrentTime());
                    if (currentTime > 0) {
                        localStorage.setItem(`yt_progress_${currentVideoId}`, currentTime);
                    }
                }
            }, 1000);
        }

        // Main parser triggered by input bar submissions
        function loadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            if (!urlInput) return;

            let videoId = '';

            if (urlInput.includes('youtu.be/')) {
                videoId = urlInput.split('youtu.be/')[1].split(/[?#]/)[0];
            } else if (urlInput.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(new URL(urlInput).search);
                videoId = urlParams.get('v');
            } else if (urlInput.includes('youtube.com/embed/')) {
                videoId = urlInput.split('youtube.com/embed/')[1].split(/[?#]/)[0];
            }

            if (videoId) {
                currentVideoId = videoId;
                checkProgressAndLoad(videoId);
            } else {
                alert('Could not parse YouTube Video ID. Please check the URL format.');
            }
        }

        // Checks for previous progress markers and prompts the user
        function checkProgressAndLoad(videoId) {
            const savedTime = localStorage.getItem(`yt_progress_${videoId}`);
            let startAt = 0;

            if (savedTime && parseInt(savedTime) > 5) {
                // Formatting seconds to a readable minutes display for prompt window
                const mins = Math.floor(savedTime / 60);
                const secs = savedTime % 60;
                const timeString = `${mins}m ${secs}s`;

                const resumeConfirm = confirm(`We found saved progress at ${timeString}. Do you want to resume where you left off?\n\n[OK] Resume Video\n[Cancel] Start from New`);
                
                if (resumeConfirm) {
                    startAt = parseInt(savedTime);
                } else {
                    // Reset record marker if user specifies fresh playback
                    localStorage.removeItem(`yt_progress_${videoId}`);
                }
            }

            // Destroy the old player component to load the clean target instance
            if (player && typeof player.destroy === 'function') {
                player.destroy();
            }
            createPlayer(videoId, startAt);
        }

        // Event listener mapping to register 'Enter' key submissions
        document.getElementById('videoUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadVideo();
            }
        });
    </script>
</body>
</html>
