<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <style>
        /* Global Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Center application card and remove default window scrollbars */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #1a103c 0%, #0b0f19 60%, #250945 100%);
            overflow: hidden;
            padding: 20px;
        }

        /* Responsive 16:9 Grid Layout Container */
        .container {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 16px;
            height: 88vh;
            aspect-ratio: 16 / 9;
            max-width: 95vw;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* Top Bar Layout containing Branding and Search Control */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
        }

        .branding h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Input Control Container bar */
        .search-box {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 4px 6px 4px 16px;
            width: 480px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .search-box:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            font-size: 14px;
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        .search-box button {
            background: #a855f7;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search-box button:hover {
            background: #9333ea;
            transform: translateY(-1px);
        }

        .search-box button:active {
            transform: translateY(0);
        }

        /* Player Wrapper displaying 16:9 aspect screen cards */
        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            overflow: hidden;
        }

        /* Initial Placeholder View Card display state layout setup */
        .placeholder-view {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: #64748b;
            z-index: 2;
            transition: opacity 0.4s ease;
        }

        .placeholder-view svg {
            width: 48px;
            height: 48px;
            fill: rgba(255, 255, 255, 0.15);
            margin-bottom: 4px;
        }

        .placeholder-view p {
            font-size: 14px;
            letter-spacing: 0.2px;
        }

        /* YouTube Target Element container layer execution hooks */
        #videoPlayer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            opacity: 0;
            z-index: 1;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #videoPlayer.ready {
            opacity: 1;
        }

        /* Layout modifications matching standard responsive mobile configurations portrait systems rules */
        @media (max-width: 960px) {
            body {
                overflow-y: auto;
                height: auto;
                padding: 16px;
            }
            .container {
                grid-template-rows: auto auto;
                height: auto;
                aspect-ratio: auto;
                width: 100%;
                padding: 16px;
            }
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            .search-box {
                width: 100%;
            }
            .video-container {
                aspect-ratio: 16 / 9;
                height: auto;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="top-bar">
            <div class="branding">
                <h1>Smart Class Viewer</h1>
            </div>
            <div class="search-box">
                <input type="text" id="videoUrl" placeholder="Paste YouTube normal video or Live stream link here..." autocomplete="off">
                <button onclick="loadVideo()">Watch</button>
            </div>
        </header>

        <main class="video-container">
            <div class="placeholder-view" id="placeholderView">
                <svg viewBox="0 0 24 24">
                    <path d="M23 12c0 6.075-4.925 11-11 11S1 18.075 1 12 5.925 1 12 1s11 4.925 11 11zm-11 9.5c5.247 0 9.5-4.253 9.5-9.5S17.247 2.5 12 2.5 2.5 6.753 2.5 12s4.253 9.5 9.5 9.5zm-1.5-13l6 3.5-6 3.5v-7z"/>
                </svg>
                <p>Waiting for an active session stream broadcast...</p>
            </div>
            <div id="videoPlayer"></div>
        </main>
    </div>

    <script>
        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        let firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        let player;
        let progressInterval;

        function onYouTubeIframeAPIReady() {
            // Core API is initialized and listening on the root level frame hooks.
        }

        function executePlayerInit(videoId, startSeconds) {
            document.getElementById('placeholderView').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('placeholderView').style.display = 'none';
            }, 400);

            if (player) {
                clearInterval(progressInterval);
                player.destroy();
            }

            player = new YT.Player('videoPlayer', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'start': startSeconds
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('videoPlayer').classList.add('ready');
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                startTrackingProgress();
            } else {
                clearInterval(progressInterval);
            }
        }

        function startTrackingProgress() {
            progressInterval = setInterval(() => {
                if (player && player.getCurrentTime) {
                    const trackingPayload = {
                        customTrackPing: true,
                        videoId: window.currentVideoId,
                        currentTime: player.getCurrentTime(),
                        duration: player.getDuration() || 0
                    };
                    window.postMessage(JSON.stringify(trackingPayload), "*");
                }
            }, 1000);
        }

        // Global Execution router interface handlers
        window.executePlayerInit = executePlayerInit;

        function loadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            if (!urlInput) return;

            let videoId = '';
            if (urlInput.includes('youtu.be/')) {
                videoId = urlInput.split('youtu.be/')[1].split(/[?#]/)[0];
            } else if (urlInput.includes('youtube.com/watch')) {
                try {
                    const urlParams = new URLSearchParams(new URL(urlInput).search);
                    videoId = urlParams.get('v');
                } catch(e) {
                    // Fallback manual parse if URL validation errors strike
                    const match = urlInput.match(/[?&]v=([^&#]*)/);
                    if (match) videoId = match[1];
                }
            } else if (urlInput.includes('youtube.com/embed/')) {
                videoId = urlInput.split('youtube.com/embed/')[1].split(/[?#]/)[0];
            } else if (urlInput.includes('youtube.com/live/')) {
                videoId = urlInput.split('youtube.com/live/')[1].split(/[?#]/)[0];
            }

            if (videoId) {
                window.currentVideoId = videoId;
                if (window.checkProgressAndPrompt) {
                    window.checkProgressAndPrompt(videoId);
                } else {
                    executePlayerInit(videoId, 0);
                }
            } else {
                alert('Could not parse YouTube Video ID. Please check the URL format (Supports normal videos & Live streams).');
            }
        }

        document.getElementById('videoUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') loadVideo();
        });

        // SAFETY INJECTION: Wires a fallback system if loading-screen framework parameters throw anomalies
        window.addEventListener('DOMContentLoaded', () => {
            if(!window.SkeletonFiestaLoader) {
                window.SkeletonFiestaLoader = { show: (cb) => cb(), hide: () => {} };
            }
        });
    </script>
    
    <script>
        function safelyInjectScript(src) {
            const s = document.createElement('script');
            s.src = src;
            s.onerror = () => console.warn(`Script failed to load safely: ${src}`);
            document.body.appendChild(s);
        }
        safelyInjectScript("ghost-cookie.js");
        safelyInjectScript("loading-screen.js");
        safelyInjectScript("sidebar-history.js");
    </script>
</body>
</html>
