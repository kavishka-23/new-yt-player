<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <style>
        :root {
            --bg-color: #0b0914;
            --card-bg: #161224;
            --accent-purple: #7c4dff;
            --text-main: #ffffff;
            --text-muted: #a5a1b8;
            --input-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        /* --- Header / Top Bar --- */
        header {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(45deg, #fff, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Search / URL Input Section --- */
        .search-container {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }

        .url-input {
            flex: 1;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .url-input:focus {
            border-color: var(--accent-purple);
        }

        /* --- Video Player Area Placeholder --- */
        .main-container {
            flex: 1;
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        .video-screen {
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* --- Overlay Modal Box --- */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 9, 20, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 16px;
            z-index: 10;
        }

        .modal-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 35px 40px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* --- Cute Animated Ghost --- */
        .character-container {
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .ghost {
            width: 46px;
            height: 65px;
            background: #ffffff;
            border-radius: 23px 23px 0 0;
            position: relative;
            animation: float 2.5s ease-in-out infinite;
            box-shadow: 0 12px 20px rgba(255, 255, 255, 0.08);
        }

        .ghost-face {
            position: absolute;
            top: 24px;
            left: 12px;
            width: 22px;
            height: 12px;
            display: flex;
            justify-content: space-between;
        }

        .eye {
            width: 5px;
            height: 5px;
            background-color: var(--card-bg);
            border-radius: 50%;
        }

        .smile {
            position: absolute;
            bottom: -3px;
            left: 6px;
            width: 10px;
            height: 5px;
            border-bottom: 2.5px solid var(--card-bg);
            border-radius: 0 0 10px 10px;
        }

        .blush {
            position: absolute;
            top: 29px;
            width: 5px;
            height: 3.5px;
            background-color: #ff94b8;
            border-radius: 50%;
        }
        .blush.left { left: 6px; }
        .blush.right { right: 6px; }

        .ghost-bottom {
            position: absolute;
            bottom: -9px;
            left: 0;
            width: 100%;
            display: flex;
        }

        .wave {
            flex: 1;
            height: 10px;
            background: #ffffff;
            border-radius: 0 0 50% 50%;
        }

        /* --- Modal Typography & Buttons --- */
        .modal-card h2 {
            font-size: 22px;
            margin: 0 0 10px 0;
            font-weight: 600;
        }

        .modal-card p {
            color: var(--text-muted);
            font-size: 14.5px;
            line-height: 1.5;
            margin: 0 0 25px 0;
        }

        .highlight {
            color: #9d7cff;
            font-weight: 600;
        }

        .button-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 12px 18px;
            border: none;
            border-radius: 12px;
            font-size: 14.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--accent-purple);
            color: var(--text-main);
            box-shadow: 0 4px 15px rgba(124, 77, 255, 0.25);
        }

        .btn-primary:hover {
            background-color: #8c61ff;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            transform: translateY(-1px);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Smart Class Viewer</div>
        <div class="search-container">
            <input type="text" class="url-input" placeholder="Paste YouTube Video URL here..." id="videoUrl">
            <button class="btn btn-primary" style="flex: initial; padding: 0 22px;" id="watchBtn">Watch</button>
        </div>
    </header>

    <main class="main-container">
        
        <div class="video-screen" id="playerContainer">
            
            <div id="player"></div>

            <div class="modal-overlay" id="welcomeModal">
                <div class="modal-card">
                    <div class="character-container">
                        <div class="ghost">
                            <div class="ghost-face">
                                <div class="eye"></div>
                                <div class="eye"></div>
                                <div class="smile"></div>
                            </div>
                            <div class="blush left"></div>
                            <div class="blush right"></div>
                            <div class="ghost-bottom">
                                <div class="wave"></div>
                                <div class="wave"></div>
                                <div class="wave"></div>
                            </div>
                        </div>
                    </div>

                    <h2>Welcome Back!</h2>
                    <p>We found saved progress at <span class="highlight" id="timestamp">0m 9s</span>. Would you like to resume where you left off?</p>

                    <div class="button-group">
                        <button class="btn btn-primary" id="resumeBtn">Resume Video</button>
                        <button class="btn btn-secondary" id="freshBtn">Start Fresh</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        // Example dynamic close behavior hooks:
        document.getElementById('resumeBtn').addEventListener('click', () => {
            document.getElementById('welcomeModal').style.display = 'none';
            // Trigger your custom player seek logic here...
        });

        document.getElementById('freshBtn').addEventListener('click', () => {
            document.getElementById('welcomeModal').style.display = 'none';
            // Trigger your custom player start-over logic here...
        });

        // [Paste your remaining YouTube Player API configurations and tracking codes here]
    </script>
</body>
</html>
