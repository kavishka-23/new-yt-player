<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <style>
        /* 1. Global Reset to prevent unexpected browser spacing */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* 2. Constrain body to the exact viewport size and activate flex centering */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #1a103c 0%, #0b0f19 60%, #250945 100%);
            overflow: hidden;
            padding: 24px;
        }

        /* 3. The Perfect Ratio Container:
           Instead of choosing just width or height, min() ensures it expands to 
           95% of your screen width OR 85% of your screen height—whichever fills the 
           screen first. The aspect-ratio forces it into a flawless video box shape.
        */
        .container {
            width: min(95vw, 150vh); 
            aspect-ratio: 16 / 9;
            max-height: 85vh;
            
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.15);
        }

        /* Top control bar alignment */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            background: linear-gradient(to right, #ffffff, #cbd5e1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-grow: 1;
            max-width: 450px;
        }

        input {
            flex-grow: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
        }

        button {
            background: linear-gradient(to right, #9333ea, #4f46e5);
            color: white;
            border: none;
            font-weight: 600;
            padding: 0 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* 4. Video Box: Grows smoothly to fill up the matching container boundaries */
        .video-wrapper {
            flex-grow: 1;
            width: 100%;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Fluid alignment for mobile viewports */
        @media (max-width: 640px) {
            body {
                overflow: auto;
                height: auto;
            }
            .container {
                height: auto;
                aspect-ratio: auto;
                width: 100%;
            }
            .header-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .input-group {
                width: 100%;
            }
            .video-wrapper {
                aspect-ratio: 16 / 9;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-bar">
            <h1>Smart Class Viewer</h1>
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="Paste YouTube Video URL here...">
                <button onclick="loadVideo()">Watch</button>
            </div>
        </div>

        <div class="video-wrapper">
            <iframe 
                id="videoPlayer"
                src="https://www.youtube.com/embed/QDS7Hp-fMqs" 
                title="YouTube video player" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

    </div>

    <script>
        function loadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const player = document.getElementById('videoPlayer');
            
            if (!urlInput) return;

            let videoId = '';

            if (urlInput.includes('youtu.be/')) {
                videoId = urlInput.split('youtu.be/')[1].split(/[?#]/)[0];
            } else if (urlInput.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(new URL(urlInput).search);
                videoId = urlParams.get('v');
            } else if (urlInput.includes('youtube.com/embed/')) {
                videoId = urlInput.split('youtube.com/embed/')[1].split(/[?#]/)[0];
            }

            if (videoId) {
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } else {
                alert('Could not parse YouTube Video ID. Please check the URL format.');
            }
        }

        document.getElementById('videoUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadVideo();
            }
        });
    </script>
</body>
</html>
