<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <style>
        /* Global spacing resets */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Center application card and remove default window scrollbars */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top left, #1a103c 0%, #0b0f19 60%, #250945 100%);
            overflow: hidden;
            padding: 20px;
        }

        /* Responsive 16:9 Grid Layout Container */
        .container {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 16px;
            height: 88vh;
            aspect-ratio: 16 / 9;
            max-width: 95vw;
            background: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(168, 85, 247, 0.15);
        }

        /* Top header elements control bar */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #ffffff;
            background: linear-gradient(to right, #ffffff, #cbd5e1, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-grow: 1;
            max-width: 450px;
        }

        input {
            flex-grow: 1;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #a855f7;
            box-shadow: 0 0 0 2px rgba(168, 85, 247, 0.2);
        }

        button {
            background: linear-gradient(to right, #9333ea, #4f46e5);
            color: white;
            border: none;
            font-weight: 600;
            padding: 0 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Outer container frame for the video element */
        .video-wrapper {
            width: 100%;
            height: 100%;
            background: #000000;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #videoPlayer {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* --- Custom Premium Glassmorphic Modal Styles --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: rgba(30, 27, 75, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 24px;
            padding: 32px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 50px rgba(168, 85, 247, 0.2);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-card h2 {
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .modal-card p {
            color: #cbd5e1;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 24px;
        }

        .modal-card span.highlight {
            color: #c084fc;
            font-weight: 600;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .modal-btn-confirm {
            background: linear-gradient(to right, #9333ea, #4f46e5);
            color: white;
            box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
        }

        .modal-btn-confirm:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .modal-btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            body {
                overflow: auto;
                height: auto;
            }
            .container {
                grid-template-rows: auto auto;
                height: auto;
                aspect-ratio: auto;
                width: 100%;
                padding: 16px;
            }
            .header-bar {
                flex-direction: column;
                align-items: flex-start;
            }
            .input-group {
                width: 100%;
            }
            .video-wrapper {
                aspect-ratio: 16 / 9;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-bar">
            <h1>Smart Class Viewer</h1>
            <div class="input-group">
                <input type="text" id="videoUrl" placeholder="Paste YouTube Video URL here...">
                <button onclick="loadVideo()">Watch</button>
            </div>
        </div>

        <div class="video-wrapper">
            <div id="videoPlayer"></div>
        </div>

    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Welcome Back!</h2>
            <p>We found saved progress at <span id="savedTimeLabel" class="highlight">0m 0s</span>. Would you like to resume where you left off?</p>
            <div class="modal-actions">
                <button id="btnResume" class="modal-btn modal-btn-confirm">Resume Video</button>
                <button id="btnNew" class="modal-btn modal-btn-cancel">Start Fresh</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        let player;
        let currentVideoId = 'QDS7Hp-fMqs'; // Initial default placeholder video ID
        let cookieInterval;
        let pendingVideoId = '';
        let pendingIsInitialLoad = false;

        // --- Core Cookie Logic Engines ---

        function setCookie(name, value) {
            const date = new Date();
            date.setTime(date.getTime() + (30 * 24 * 60 * 60 * 1000)); // 30 Day lifespan
            const expires = "; expires=" + date.toUTCString();
            document.cookie = name + "=" + (value || "") + expires + "; path=/; SameSite=Lax";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) == ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Standard callback fired immediately when the remote YouTube engine starts up
        function onYouTubeIframeAPIReady() {
            checkProgressAndLoad(currentVideoId, true);
        }

        // Instantiates or reinstantiates a clean player tracking system
        function createPlayer(videoId, startSeconds = 0) {
            clearInterval(cookieInterval);

            player = new YT.Player('videoPlayer', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'playsinline': 1,
                    'start': startSeconds
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            startCookieTracking();
        }

        // Aggressively monitors current timestamps and writes directly to cookies every 500ms
        function startCookieTracking() {
            clearInterval(cookieInterval);
            cookieInterval = setInterval(() => {
                if (player && typeof player.getCurrentTime === 'function') {
                    const currentTime = Math.floor(player.getCurrentTime());
                    const duration = player.getDuration ? player.getDuration() : 0;
                    
                    if (currentTime > 2 && (duration === 0 || currentTime < duration - 5)) {
                        setCookie(`yt_cookie_${currentVideoId}`, currentTime);
                    }
                }
            }, 500); 
        }

        // URL Formatter parser
        function loadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            if (!urlInput) return;

            let videoId = '';

            if (urlInput.includes('youtu.be/')) {
                videoId = urlInput.split('youtu.be/')[1].split(/[?#]/)[0];
            } else if (urlInput.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(new URL(urlInput).search);
                videoId = urlParams.get('v');
            } else if (urlInput.includes('youtube.com/embed/')) {
                videoId = urlInput.split('youtube.com/embed/')[1].split(/[?#]/)[0];
            }

            if (videoId) {
                currentVideoId = videoId;
                checkProgressAndLoad(videoId, false);
            } else {
                alert('Could not parse YouTube Video ID. Please check the URL format.');
            }
        }

        // Decides timeline placement based on cookie availability 
        function checkProgressAndLoad(videoId, isInitialLoad) {
            const savedTime = getCookie(`yt_cookie_${videoId}`);

            if (savedTime && parseInt(savedTime) > 5) {
                const mins = Math.floor(savedTime / 60);
                const secs = savedTime % 60;
                
                // Store parameters globally so the modal handles completion execution safely
                pendingVideoId = videoId;
                pendingIsInitialLoad = isInitialLoad;

                // Open our custom stylized glass card window layout instead of old browser blocks
                document.getElementById('savedTimeLabel').innerText = `${mins}m ${secs}s`;
                document.getElementById('customModal').classList.add('active');
            } else {
                // Play straight away if no tracking cookie is found
                executePlayerInit(videoId, 0, isInitialLoad);
            }
        }

        // Final player engine rendering wrapper
        function executePlayerInit(videoId, startAt, isInitialLoad) {
            if (!isInitialLoad && player && typeof player.destroy === 'function') {
                player.destroy();
            }
            createPlayer(videoId, startAt);
        }

        // --- Custom Modal Button Action Observers ---

        document.getElementById('btnResume').addEventListener('click', () => {
            const savedTime = getCookie(`yt_cookie_${pendingVideoId}`);
            document.getElementById('customModal').classList.remove('active');
            executePlayerInit(pendingVideoId, parseInt(savedTime || 0), pendingIsInitialLoad);
        });

        document.getElementById('btnNew').addEventListener('click', () => {
            setCookie(`yt_cookie_${pendingVideoId}`, "", -1); // Clear past reference marker
            document.getElementById('customModal').classList.remove('active');
            executePlayerInit(pendingVideoId, 0, pendingIsInitialLoad);
        });

        // Register action triggers upon hitting 'Enter'
        document.getElementById('videoUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadVideo();
            }
        });
    </script>
</body>
</html>
