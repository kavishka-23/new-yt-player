<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Class Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        iframe {
            background-color: #000;
        }
    </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-6 overflow-hidden">

    <div class="w-full max-w-[95vw] h-full max-h-[90vh] bg-slate-900/60 backdrop-blur-md rounded-3xl border border-slate-700/50 shadow-2xl flex flex-col p-6 box-border">
        
        <h1 class="text-center text-white text-2xl md:text-3xl font-bold tracking-wide mb-4 shrink-0">
            Smart Class Viewer
        </h1>

        <div class="flex gap-3 mb-5 shrink-0">
            <input 
                type="text" 
                id="videoUrl" 
                placeholder="Paste YouTube Video URL here..." 
                class="flex-1 bg-slate-800/80 border border-slate-700 text-white rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 transition-colors placeholder-slate-500"
            >
            <button 
                onclick="loadVideo()" 
                class="bg-white text-slate-900 font-semibold px-6 py-3 rounded-xl hover:bg-slate-100 transition-all text-sm shadow-md shrink-0"
            >
                Watch
            </button>
        </div>

        <div class="flex-1 w-full relative bg-black rounded-2xl overflow-hidden shadow-inner border border-slate-800">
            <iframe 
                id="videoPlayer"
                class="absolute top-0 left-0 w-full h-full"
                src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
                title="YouTube video player" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

    </div>

    <script>
        function loadVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const player = document.getElementById('videoPlayer');
            
            if (!urlInput) {
                alert('Please paste a valid YouTube URL first!');
                return;
            }

            let videoId = '';

            if (urlInput.includes('youtu.be/')) {
                videoId = urlInput.split('youtu.be/')[1].split(/[?#]/)[0];
            } else if (urlInput.includes('youtube.com/watch')) {
                const urlParams = new URLSearchParams(new URL(urlInput).search);
                videoId = urlParams.get('v');
            } else if (urlInput.includes('youtube.com/embed/')) {
                videoId = urlInput.split('youtube.com/embed/')[1].split(/[?#]/)[0];
            }

            if (videoId) {
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
            } else {
                alert('Could not parse YouTube Video ID. Please check the URL format.');
            }
        }

        document.getElementById('videoUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                loadVideo();
            }
        });
    </script>
</body>
</html>
